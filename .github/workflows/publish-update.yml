# Publish a desktop release, and the manifest every running copy polls.
#
# v7.78. This is the pipeline the UPDATER needs, and it is a separate workflow
# from release.yml on purpose. release.yml is inherited from upstream OpenDraft:
# it builds Android, iOS, a Mac App Store target and a Docker image, and its
# publish job verifies seven assets this product does not ship. Bending it into
# shape is its own job. This one does exactly what in-app updating requires,
# and nothing else, so it can be read in one sitting.
#
# WHY IT PUBLISHES SOMEWHERE ELSE. The source repo is private. raw.github-
# usercontent.com will not serve a file from a private repo without a token,
# and a token shipped inside the app is a token anybody has — which is the whole
# reason services/updateCheck.ts points at a separate public repo. So the
# artifacts and the manifest go to dac8767/ScriptCraft-releases, and that needs
# a token with write access to it: GITHUB_TOKEN is scoped to THIS repo only.
#
# ── What must exist before this can run ──────────────────────────────────────
#
#   dac8767/ScriptCraft-releases           a PUBLIC repo, holding latest.json
#                                          on main plus the installers on its
#                                          Releases
#
#   secrets.TAURI_SIGNING_PRIVATE_KEY      from `npm run tauri signer generate`
#   secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its passphrase, if one was set
#                                          (see src-tauri/UPDATER.md — losing
#                                          this key means no installed copy can
#                                          ever accept another update)
#
#   secrets.RELEASES_REPO_TOKEN            a fine-grained PAT with Contents:
#                                          write on ScriptCraft-releases only
#
#   secrets.APPLE_*                        optional. Without them the macOS
#                                          build is UNSIGNED — it still updates
#                                          itself, but Gatekeeper will refuse
#                                          the first download. See §6 of
#                                          CLAUDE.md.
name: Publish Update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v7.78'
        required: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

# Deliberately NOT `on: push: tags` — release.yml already fires on those, and
# two workflows building the same tag would race each other for the release.

permissions:
  contents: read

jobs:
  # ── Gate first, on one cheap runner ────────────────────────────────────────
  # A build matrix that takes half an hour and then cannot publish because the
  # signing key was never configured is half an hour nobody gets back.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # THE TAG, not the branch this was dispatched from. The build jobs
          # below check out the tag, so a gate reading the branch would be
          # certifying a different tree than the one that ships — passing on a
          # signing key that is on the branch and not in the release.
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: The updater is fully configured
        # --release turns the "no signing key yet" note into a hard failure.
        # Everything it checks is a file in the repo; nothing here needs a
        # browser or a build.
        run: node frontend/devtools/check-updater-config.mjs --release
      - name: The tag matches the version in the tree
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          # Read APP_VERSION straight out of the source of truth. The first cut
          # here called require() on sync-version.mjs — an ES module, so it
          # always threw, and the answer only ever came from the `||` fallback.
          # A check that works because its first branch reliably fails is one
          # nobody can reason about the day it stops failing.
          APP=$(sed -n "s/.*APP_VERSION = '\([^']*\)'.*/\1/p" frontend/src/data/changelog.ts | head -1)
          if [ -z "$APP" ]; then echo "::error::could not read APP_VERSION"; exit 1; fi
          echo "tag=$TAG  APP_VERSION=$APP"
          case "$TAG" in
            "v$APP"|"v$APP".0|"$APP") ;;
            *) echo "::error::tag $TAG does not match app version $APP"; exit 1 ;;
          esac

  build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-26
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # The exact list release.yml already builds Linux with. It had been
          # written from memory here, with libayatana-appindicator3-dev in place
          # of libappindicator3-dev — a substitution that may well work and has
          # never been proven on this runner, which is not a thing to discover
          # inside a three-platform matrix.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # v7.79: WITHOUT THIS, APPLE_SIGNING_IDENTITY NAMES A CERTIFICATE THAT IS
      # NOT ON THE RUNNER. A GitHub macOS runner starts with an empty keychain;
      # release.yml gets away with passing only env vars because tauri-action
      # imports the .p12 itself, and this workflow calls `tauri build` directly.
      # So the identity would resolve to nothing and the build would fail at the
      # very end, after twenty minutes of compiling. Lifted from release.yml,
      # which already does exactly this and works.
      - name: Import the Apple Developer certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No Apple certificate configured — the build will be unsigned"
            exit 0
          fi
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import $RUNNER_TEMP/certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm $RUNNER_TEMP/certificate.p12
          echo "Apple Developer certificate imported"

      - name: Build with updater artifacts
        # The overlay is what turns signing on — see src-tauri/UPDATER.md for
        # why it is not in tauri.conf.json. Every artifact comes out with a
        # detached .sig beside it, and the app refuses anything unsigned.
        shell: bash
        run: |
          set -euo pipefail
          # AN EMPTY SIGNING IDENTITY IS NOT THE SAME AS NONE. A secret that
          # does not exist arrives as "", and Apple's four are not configured
          # yet (§6 of CLAUDE.md — the Developer ID is still open), so every
          # one of them is "" on this runner. Rather than trust that the
          # bundler reads "" as "do not sign", unset them — which is exactly
          # what build-desktop.sh --local already does, and it does it because
          # this bit them once already.
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD
            echo "no Apple identity configured — building UNSIGNED"
          fi
          npx --prefix frontend tauri build \
            --target ${{ matrix.target }} \
            --config src-tauri/tauri.release.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple's signing, which is a different question from Tauri's — one
          # says "will macOS open this", the other "is this really ours".
          # Absent secrets leave the bundle unsigned rather than failing.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}

      - name: Collect the installers and their signatures
        shell: bash
        run: |
          mkdir -p dist-update
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          # The updater artifacts and the plain installers are both wanted: the
          # first are what the app downloads, the second what a person does.
          # -print0/-d '' so a space in a filename cannot split one into two.
          # v7.80: the .sig names were v1's (`-setup.exe.zip.sig`,
          # `.AppImage.tar.gz.sig`). Tauri v2 signs the installers themselves,
          # so those globs matched nothing and Windows' and Linux' signatures
          # were never even uploaded — which is why the first manifest came out
          # with only macOS in it.
          find "$BUNDLE" \( \
            -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
            -o -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            -o -name '*.msi' -o -name '*.msi.sig' \
            -o -name '*.AppImage' -o -name '*.AppImage.sig' \
            -o -name '*.dmg' -o -name '*.deb' \
          \) -print0 | while IFS= read -r -d '' f; do cp "$f" dist-update/; done
          ls -la dist-update

      # v7.81: v5 runs on node20, which GitHub is retiring — the runners already
      # force it onto node24 and say so on every job. v7/v8 target node24
      # natively. Checked before bumping two majors: every input used here still
      # exists, and the defaults that decide the LAYOUT are unchanged
      # (archive: true, skip-decompress: false). A layout change would have
      # emptied `platforms` again, which is the failure that reports success.
      - uses: actions/upload-artifact@v7
        with:
          # The target triple travels in the NAME because the manifest
          # generator reads the architecture off the path, and refuses to guess
          # when it cannot — a macOS artifact labelled with the wrong chip is an
          # update that silently cannot run on the machine that accepted it.
          name: update-${{ matrix.target }}
          path: dist-update/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish to ScriptCraft-releases
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: update-*
          path: artifacts

      # download-artifact flattens each artifact into artifacts/<name>/, and
      # <name> carries the target triple — which is exactly what the generator
      # reads to tell an Apple Silicon build from an Intel one.
      - name: Build latest.json from what was actually built
        run: |
          node frontend/devtools/build-release-manifest.mjs \
            --artifacts artifacts \
            --base-url "https://github.com/dac8767/ScriptCraft-releases/releases/download/${{ inputs.tag }}" \
            --url "https://github.com/dac8767/ScriptCraft-releases/releases/tag/${{ inputs.tag }}" \
            -o latest.json
          cat latest.json

      - name: Publish the release and the manifest
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          REPO: dac8767/ScriptCraft-releases
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS="--prerelease"; fi

          # The RELEASE first: latest.json points at these urls, so a manifest
          # published before the files it names would send every running copy
          # to a 404 for as long as the gap lasted.
          gh release create "$TAG" --repo "$REPO" --title "ScriptCraft $TAG" \
            --notes "$(node -e "
              const l=require('./frontend/src/data/changelog.json');
              const v='$TAG'.replace(/^v/,'');
              const e=l.find(x=>x.version===v);
              process.stdout.write((e?.changes||[]).map(c=>'- '+c).join('\n')||'ScriptCraft $TAG');
            ")" $FLAGS || echo "release already exists — adding assets to it"
          find artifacts -type f -print0 \
            | xargs -0 gh release upload "$TAG" --repo "$REPO" --clobber

          # …and only THEN the manifest, which is what makes the update live.
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" releases-repo
          cp latest.json releases-repo/latest.json
          cd releases-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "ScriptCraft $TAG" || { echo "manifest unchanged"; exit 0; }
          git push
