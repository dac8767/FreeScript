[package]
# v2.85: crate renamed — `tauri dev` names the macOS app menu after the DEBUG
# BINARY, so "Hide freedraft" lingered despite productName being ScriptCraft.
# The com.freedraft.app identifier stays: identifiers persist user data.
name = "scriptcraft"
version = "7.89.0"
description = "ScriptCraft - Professional Screenwriting Application"
authors = ["ScriptCraft"]
edition = "2021"

[lib]
name = "scriptcraft_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
# Pinned: tauri 2.11 / wry 0.55 introduced an Android startup crash. These
# pins match the v0.16.1 build (last release known to run on Android).
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
# Pinned: see comment on tauri-build above. wry 0.54 (transitive via
# tauri 2.10.3) works on Android; wry 0.55 (tauri 2.11) does not.
tauri = { version = "=2.10.3", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "=2.4.0", features = ["sqlite"] }
tauri-plugin-fs = "=2.5.0"
tauri-plugin-dialog = "=2.7.0"
# v6.33: File ▸ Print opens the export PDF in the OS viewer (openPath).
# 2.5.4 is the newest release whose tauri requirement (^2.10) accepts the
# =2.10.3 pin above.
tauri-plugin-opener = "=2.5.4"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
percent-encoding = "2"

# v7.78, in-app updating — DESKTOP ONLY, and the scoping is not optional.
# tauri-plugin-updater supports Windows, macOS and Linux; it does not build for
# Android or iOS, and this repo's CI still builds both. Left in the plain
# [dependencies] table it would break those jobs on a feature they can never
# use — the mobile stores do their own updating.
# Versions pinned exactly, for the same reason as the opener note above:
# updater 2.10.1 requires tauri ^2.10 and process 2.3.1 requires ^2.8.2, both
# satisfied by the =2.10.3 pin, and neither is free to float past it.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.10.1"
# The restart that follows an install. A separate crate in Tauri v2 because the
# updater swaps the bundle on disk and stops there — it relaunches nothing.
tauri-plugin-process = "=2.3.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# v6.36: File ▸ Print runs the REAL macOS print dialog on the export PDF via
# PDFKit (print_pdf_dialog in lib.rs) — no viewer in between. Pinned to the
# exact objc2 generation already in the tree (wry/tao pull objc2 0.6.4 and
# the 0.3.2 framework crates), so only objc2-pdf-kit is new to the lockfile.
[target.'cfg(target_os = "macos")'.dependencies]
# "exception": NSException → Err instead of process abort (v6.37 print crash).
objc2 = { version = "=0.6.4", features = ["exception"] }
objc2-foundation = "=0.3.2"
objc2-app-kit = "=0.3.2"
objc2-pdf-kit = "=0.3.2"

# v7.10, Derek: "remove the Action Rewrite tool completely from the app." That
# retired the only user of `keyring` (the BYO Anthropic key lived in the OS
# keychain), so the crate goes with it — and the About window's open-source
# list drops keyring-rs in this same change, per the standing rule.

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# strip = false: keep symbols so Android crash reports can be symbolicated via
# Play Console "Native debug symbols" upload and ndk-stack. Adds ~MBs to the
# desktop binary but does not affect runtime performance.
strip = false
debug = "line-tables-only"
